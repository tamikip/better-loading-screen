description='''传送到尚未加载、渲染完成的区域时，显示维度图标、小贴士和元素加载进度，地形就绪后平滑淡出。
支持同维度传送、切换维度、昼夜自动配色、自定义音效，以及资源包／数据包替换文字、图标和 TTF 字体。
客户端必需，服务端可选；无额外必装模组。

Loading overlay for teleports and dimension transitions, with terrain readiness checks, smooth fading, dimension icons, tips, day/night themes and custom audio. Supports resource/data pack customization. Client required; server optional. No additional mod dependencies.'''
